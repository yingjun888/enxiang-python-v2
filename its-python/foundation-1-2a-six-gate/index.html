const QUESTIONS=[{"concept":"INT_STRING","origin":["A207"],"gate":1,"stage":"名詞本義","p":"關於 int()，哪一個說法正確？","code":"int(\"42\")","kind":"single","o":["可把合法整數字串轉成整數；格式不合法時可能報錯","所有字串都會變成整數","會將數值四捨五入","只會檢查型別，不會轉換"],"key":0,"why":"int(\"42\") 可以得到 42，但 int(\"4.2\") 會發生 ValueError；不能把所有字串一律視為可轉整數。","retry":{"p":"教學後確認：下列何者可以直接成功轉為整數 19？","code":"","kind":"single","o":["int(\"19.0\")","int(\"19\")","int(\"1a\")","int(\"nineteen\")"],"key":1}},{"concept":"INT_STRING","origin":["A207"],"gate":2,"stage":"量與對象（操作對象及狀態）","p":"依序執行後，print() 印出什麼？請注意 s 原本的型別。","code":"s = \"7.8\"\nv = int(float(s))\nprint(type(s).__name__, v)","kind":"single","o":["float 7","str 7","str 8","ValueError"],"key":1,"why":"s 仍然是字串，float(s) 產生新的浮點數 7.8，int() 再將該值截斷成 7；並沒有把 s 本身改成 float。","retry":{"p":"教學後確認：印出的是哪個型別名稱？","code":"s = \"5.4\"\nx = float(s)\nprint(type(s).__name__)","kind":"single","o":["float","int","str","ValueError"],"key":2}},{"concept":"INT_STRING","origin":["A207"],"gate":3,"stage":"直接條件應用","p":"自行輸入最後印出的數字。","code":"print(int(\"0042\"))","kind":"text","key":"42","why":"\"0042\" 是合法整數格式的字串，轉換結果為整數 42，輸出不保留前置零。","retry":{"p":"教學後確認：這段會印出多少？","code":"print(int(\"031\"))","kind":"text","key":"31"}},{"concept":"INT_STRING","origin":["A207"],"gate":4,"stage":"條件改變","p":"只改動字串中的小數點，兩次轉換結果有何不同？","code":"a = int(\"12\")\nb = int(\"12.0\")","kind":"single","o":["兩者都得到 12","兩者都得到 12.0","a 得到 12；b 發生 ValueError","a 發生錯誤；b 得到 12"],"key":2,"why":"整數字串 \"12\" 可以直接轉換，但 \"12.0\" 含小數點，不符合 int() 直接解析整數字串的格式。","retry":{"p":"教學後確認：哪項敘述正確？","code":"int(\"-8\")\nint(\"-8.0\")","kind":"single","o":["兩者都得到 -8","兩者都報錯","前者得到 8，後者報錯","前者得到 -8，後者 ValueError"],"key":3}},{"concept":"INT_STRING","origin":["A207"],"gate":5,"stage":"跨概念連結","p":"先把字串轉成 float，再轉 int，最後輸出多少？","code":"s = \"8.9\"\na = float(s)\nprint(int(a))","kind":"text","key":"8","why":"先用 float() 解析 \"8.9\" 得到 8.9，再用 int() 朝零截去小數得到 8。","retry":{"p":"教學後確認：換成新的字串後結果？","code":"s = \"4.6\"\nprint(int(float(s)))","kind":"text","key":"4"}},{"concept":"INT_STRING","origin":["A207"],"gate":6,"stage":"陷阱辨識／反問理由","p":"同學說：『只要數字看起來是 5.0，int() 就一定可以直接處理。』哪個反駁最精確？","code":"int(\"5.0\")\nint(5.0)","kind":"single","o":["兩者都一定得到 5","兩者都一定報錯","字串先轉 int 再變浮點數","前者 ValueError，後者得到 5，因為輸入型別與格式不同"],"key":3,"why":"\"5.0\" 是含小數點的字串，不是合法整數字串；5.0 是 float，可直接由 int() 截斷成 5。","retry":{"p":"教學後確認：兩個運算的結果依序為何？","code":"int(\"6.0\")\nint(float(\"6.0\"))","kind":"single","o":["ValueError；6","6；6","6；ValueError","ValueError；ValueError"],"key":0}},{"concept":"ROUND_TIE_EVEN","origin":["A209","A211"],"gate":1,"stage":"名詞本義","p":"Python 的 round() 在數值剛好位於兩整數正中間時，遵守哪個規則？","code":"round(4.5)","kind":"single","o":["一律往較大整數進位","選擇較接近的偶數整數","一律截去小數","所有 .5 一律變成奇數"],"key":1,"why":"在精確的 .5 平手情況，Python round() 採用 ties-to-even；4.5 的結果是 4。","retry":{"p":"教學後確認：round(2.5) 等於？","code":"print(round(2.5))","kind":"single","o":["3","2","2.5","ValueError"],"key":1}},{"concept":"ROUND_TIE_EVEN","origin":["A209","A211"],"gate":2,"stage":"量與對象（操作對象及狀態）","p":"round() 回傳新結果後，變數 n 原本的數值會自動改變嗎？輸出為何？","code":"n = 7.5\nr = round(n)\nprint(n, r)","kind":"single","o":["8 8","7 8","7.5 7","7.5 8"],"key":3,"why":"round(n) 回傳整數 8，但 n 本身仍是 7.5，並未被覆寫。","retry":{"p":"教學後確認：只印出 n，會顯示多少？","code":"n = 4.5\nr = round(n)\nprint(n)","kind":"text","key":"4.5"}},{"concept":"ROUND_TIE_EVEN","origin":["A209","A211"],"gate":3,"stage":"直接條件應用","p":"自行輸入最後輸出的數字。","code":"print(round(7.5))","kind":"text","key":"8","why":"7.5 在 7 與 8 中間，8 為偶數，所以輸出 8。","retry":{"p":"教學後確認：round(9.5) 得到多少？","code":"print(round(9.5))","kind":"text","key":"10"}},{"concept":"ROUND_TIE_EVEN","origin":["A209","A211"],"gate":4,"stage":"條件改變","p":"只改變 .5 前面的整數，依序輸出哪兩個值？","code":"print(round(6.5))\nprint(round(7.5))","kind":"single","o":["6 與 8","7 與 8","6 與 7","7 與 7"],"key":0,"why":"6.5 平手取偶得到 6；7.5 平手取偶得到 8，因此不是所有 .5 都向上進位。","retry":{"p":"教學後確認：現在改為 8.5，結果為何？","code":"print(round(8.5))","kind":"single","o":["9","8.5","8","ValueError"],"key":2}},{"concept":"ROUND_TIE_EVEN","origin":["A209","A211"],"gate":5,"stage":"跨概念連結","p":"結合 int() 的截斷與 round() 平手取偶，最終輸出多少？","code":"print(int(1.9) + round(2.5))","kind":"text","key":"3","why":"int(1.9) 是 1；round(2.5) 是 2；相加得到 3，兩者規則不能混用。","retry":{"p":"教學後確認：改用這組數值後輸出多少？","code":"print(int(3.9) + round(4.5))","kind":"text","key":"7"}},{"concept":"ROUND_TIE_EVEN","origin":["A209","A211"],"gate":6,"stage":"陷阱辨識／反問理由","p":"同學說：『round() 跟 int() 都只是丟掉小數，所以是一樣的。』哪項說明足以反駁？","code":"round(2.5)\nint(2.5)","kind":"single","o":["兩者結果剛好一樣，所以運算規則相同","round(2.5) 是 3；int(2.5) 是 2","兩者都得到 2，但前者是平手取偶、後者是朝零截斷","round(2.5) 會出現 ValueError"],"key":2,"why":"結果相同不代表規則相同：round() 的 2.5 平手取偶得到 2；int() 的 2.5 朝零截斷也得到 2。換其他條件可能不同。","retry":{"p":"教學後確認：換數字後，兩者結果依序為何？","code":"int(7.9)\nround(7.5)","kind":"single","o":["8；8","7；7","8；7","7；8"],"key":3}}];
const $=id=>document.getElementById(id),iso=()=>new Date().toISOString();
const html=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fresh=()=>({schema:SCHEMA,version:VERSION,source:{initialVersion:'ITS_1_2A_FOUNDATION_V1',initialIds:['A207','A209','A211'],initialCorrect:9,initialCount:12},createdAt:iso(),startedAt:null,completedAt:null,index:0,phase:'intro',results:[],viewHistory:[]});
let S;
try{S=JSON.parse(localStorage.getItem(STORAGE)||'null')}catch(e){}
if(!S||S.version!==VERSION||!Array.isArray(S.results))S=fresh();
let at=Date.now();
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(S))}catch(e){$('exportStatus').textContent='本機儲存不可用，完成後請使用複製 JSON'}};
function current(){return QUESTIONS[S.index]}
function stamp(){let t=Math.max(0,(Date.now()-at)/1000);at=Date.now();return Math.round(t*1000)/1000}
function source(){let q=current();return q?{concept:q.concept,gate:q.gate,origin:q.origin,stage:q.stage}:{}}
function result(){let q=current();let r=S.results.find(x=>x.concept===q.concept&&x.gate===q.gate);if(!r){r={...source(),first:null,retry:null,status:'IN_PROGRESS'};S.results.push(r)}return r}
function isRight(q,v){return v!==null&&v!==undefined&&String(v).trim()===String(q.key)}
function choices(q){if(q.kind==='text')return '<label for="answer" class="muted small">請輸入程式實際輸出（不加引號）</label><input type="text" id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text" placeholder="在此輸入答案">';return '<div role="radiogroup" aria-label="單選選項">'+q.o.map((o,i)=>'<label class="option"><input type="radio" name="ans" value="'+i+'"><span><b>'+('ABCD'[i])+'.</b> '+html(o)+'</span></label>').join('')+'</div>'}
function entered(){let q=S.phase==='retry'?current().retry:current();let v=q.kind==='text'?$('answer').value.trim():document.querySelector('input[name=ans]:checked')?.value;return v===undefined||v===''?null:v}
function statusbar(){let n=S.results.filter(x=>x.first).length;$('progressText').textContent='首次作答 '+n+'/12 ｜ 現在：'+(S.phase==='done'?'已結束':S.phase==='intro'?'說明':S.phase==='retry'?'教學後確認':'無提示驗證');$('progress').style.width=Math.round(n/12*100)+'%'}
function render(){statusbar();const p=$('panel'),q=current();$('exportPanel').classList.toggle('hide',S.phase!=='done');
if(S.phase==='intro'){p.innerHTML='<h2>測驗方式</h2><p>兩組錯誤概念，各六關：①名詞本義、②操作對象與狀態、③直接應用、④條件改變、⑤跨概念連結、⑥陷阱辨識。</p><p class="note">每關先獨立回答。答錯會先出現簡短補教，之後換一道小題確認；補教後答對僅算「提示後通過」，不算首次獨立通過。</p><p class="note warn">若同一關教學後換題仍答錯，就停止該概念後續六關，避免死背硬做。下一個概念可以繼續。</p><p>不必重新作 1-2A；今晚這份是獨立弱點驗證。完成後請匯出 JSON。</p><button id="begin" class="primary">開始 12 關六連問</button>';$('begin').onclick=()=>{S.startedAt=S.startedAt||iso();S.phase='first';save();at=Date.now();render()};return}
if(S.phase==='done'){summary();return}
if(!q){S.phase='done';S.completedAt=S.completedAt||iso();save();render();return}
if(S.phase==='reteach'){let r=result();p.innerHTML='<span class="pill">概念 '+html(q.concept)+'｜Gate '+q.gate+'</span><h2>這一關需要先補教</h2><p class="note bad">首次答案未通過（或選擇不懂）。這個第一次答案已保存，不會被覆寫。</p><p class="note">'+html(q.why)+'</p><p>接下來換數值或問法，再做一次短確認。這次就算答對，也只會記錄為「補教後通過」。</p><button id="goRetry" class="primary">我看懂了｜做換題確認</button>';$('goRetry').onclick=()=>{S.phase='retry';save();at=Date.now();render()};return}
const actual=S.phase==='retry'?q.retry:q;
p.innerHTML='<span class="pill">'+(q.concept==='INT_STRING'?'概念一｜int() 轉換限制':'概念二｜round() 平手取偶')+'</span><p class="muted small">Gate '+q.gate+'/6｜'+html(q.stage)+'｜'+(S.phase==='retry'?'教學後短確認':'首次無提示作答')+'</p><h2>'+html(actual.p)+'</h2>'+(actual.code?'<pre>'+html(actual.code)+'</pre>':'')+choices(actual)+'<button id="submit" class="primary">鎖定本次答案</button><button id="unknown">這一題我真的不懂</button><p class="muted small">送出後首次答案無法修改；不要用猜測代替理解。</p>';
$('submit').onclick=()=>submit(false);$('unknown').onclick=()=>submit(true)}
function submit(unknown){let q=current(),actual=S.phase==='retry'?q.retry:q,v=unknown?null:entered();if(v===null&&!unknown){alert('請先選擇或填寫答案；若不懂可選「這一題我真的不懂」。');return}
let x={kind:actual.kind,response:v,unknown,correct:!unknown&&isRight(actual,v),seconds:stamp(),submittedAt:iso()},r=result();
if(S.phase==='first'){if(r.first)return;r.first=x;if(x.correct){r.status='INDEPENDENT_PASS';advance()}else{r.status='NEEDS_RETEACHING';S.phase='reteach'}}else{if(r.retry)return;r.retry=x;r.status=x.correct?'PROMPTED_PASS':'NEEDS_RETEACHING';if(!x.correct){let cc=q.concept;let j=S.index+1;while(j<QUESTIONS.length&&QUESTIONS[j].concept===cc){let z=QUESTIONS[j];S.results.push({concept:z.concept,gate:z.gate,origin:z.origin,stage:z.stage,first:null,retry:null,status:'BLOCKED_BY_PREREQUISITE'});j++}S.index=j;S.phase='first';if(S.index>=QUESTIONS.length)finish();}else advance()}
S.viewHistory.push({event:'submit',concept:q.concept,gate:q.gate,mode:r.retry?'retry':'first',time:iso()});save();render()}
