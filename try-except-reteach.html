<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>恩翔 Python｜try/except/else/finally 微教學</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#172033;--muted:#667085;--line:#d7dde7;--blue:#175cd3}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:720px;margin:auto;padding:12px 10px 28px}
.top,.card,.result{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px 14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(16,24,40,.05)}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef4ff;color:#1849a9;font-size:12px;font-weight:800}
h1{font-size:23px;margin:8px 0 4px}.small{font-size:13px;color:var(--muted);line-height:1.55}
.track{height:7px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:12px}.fill{height:100%;width:5%;background:var(--blue);transition:.25s}.status{font-size:12px;color:var(--muted);margin-top:7px}
.step{font-size:13px;font-weight:800;color:#475467;margin-bottom:8px}.prompt{font-size:18px;line-height:1.55;font-weight:760;margin:6px 0 12px}
.flow{background:#f8fafc;border:1px solid #e4e7ec;border-radius:14px;padding:14px;line-height:1.75;font-weight:760;margin:10px 0}
.code{background:#111827;color:white;border-radius:12px;padding:12px 13px;white-space:pre;overflow:auto;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin:10px 0 14px}
.option,.unknown,.primary,.secondary{width:100%;min-height:52px;border-radius:13px;padding:12px 13px;margin:8px 0;font-size:16px;line-height:1.4;text-align:left}
.option{border:1.5px solid #cfd5df;background:#fff}.unknown{border:1.5px dashed #98a2b3;background:#f8fafc;color:#475467}
.primary{border:1px solid var(--blue);background:var(--blue);color:white;font-weight:800;text-align:center}.secondary{border:1px solid #cfd5df;background:white;font-weight:800;text-align:center}
.fb{border-left:5px solid #f4b740;background:#fff8e8;border-radius:11px;padding:12px 13px;line-height:1.55;margin:10px 0}.good{border-left-color:#12b76a;background:#ecfdf3}.bad{border-left-color:#f04438;background:#fff1f0}
.hidden{display:none!important}pre.log{white-space:pre-wrap;background:#f8fafc;border:1px solid #e4e7ec;border-radius:12px;padding:11px;font-size:12px;line-height:1.45}
@media(max-width:520px){.prompt{font-size:17px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="badge">3 分鐘微教學｜只補真正缺口</span>
    <h1>try / except / else / finally</h1>
    <div class="small">目標不是背名稱，而是建立「先看 try 有沒有例外」的分流流程。</div>
    <div class="track"><div id="fill" class="fill"></div></div>
    <div id="status" class="status">準備開始</div>
  </div>
  <section id="stage" class="card"></section>
  <section id="result" class="result hidden"></section>
</div>

<script>
(function(){
var state={route:[],stopped:false};
var stage=document.getElementById('stage'),result=document.getElementById('result'),fill=document.getElementById('fill'),status=document.getElementById('status');
function setP(p,t){fill.style.width=p+'%';status.textContent=t;}
function opt(t,v){return '<button class="option" data-v="'+v+'">'+t+'</button>';}
function unk(){return '<button class="unknown" data-v="__U__">我不懂／我還是不確定</button>';}
function mount(h,fn){stage.innerHTML=h;var b=stage.querySelectorAll('button[data-v]');for(var i=0;i<b.length;i++)b[i].onclick=function(){fn(this.getAttribute('data-v'));};}
function log(s,a){state.route.push(s+' → '+a);}
function stop(s){log(s,'NOT_UNDERSTOOD');state.stopped=true;showResult(false);}
function flow(){
  return '<div class="flow">① 先執行 <b>try</b><br>② try 有符合的例外 → <b>except</b><br>③ try 沒有例外 → <b>else</b><br>④ 最後通常都會到 <b>finally</b></div>';
}

function intro(){
setP(12,'微教學｜先建立流程');
mount(
'<div class="step">先記一件事</div>'+
'<div class="prompt">不要先背 except、else、finally。第一步永遠先問：</div>'+
'<div class="flow" style="text-align:center;font-size:20px">try 裡有沒有發生例外？</div>'+
flow()+
'<button id="go" class="primary">開始 3 題驗證</button>',
function(){});
document.getElementById('go').onclick=q1;
}

function q1(){
setP(35,'驗證 1 / 3｜沒有例外');
mount(
'<div class="step">驗證 1｜沒有例外</div>'+
'<div class="code">try:\n    x = 3 + 2\nexcept ValueError:\n    print("E")\nelse:\n    print("OK")\nfinally:\n    print("END")</div>'+
'<div class="prompt">try 沒有發生例外。哪一條路徑正確？</div>'+
opt('A. except → finally','A')+
opt('B. else → finally','B')+
opt('C. except → else → finally','C')+
unk(),
function(v){
 if(v==='__U__')return stop('Q1');
 log('Q1',v);
 if(v==='B')q2();
 else q1hint();
});
}
function q1hint(){
mount('<div class="fb bad">先只問：try 有沒有例外？這題沒有。<br><br>所以 except 不會執行，會走 else；最後再到 finally。</div>'+flow()+
'<button id="r" class="primary">再答一次</button>'+unk(),
function(v){if(v==='__U__')stop('Q1_hint');});
document.getElementById('r').onclick=q1;
}

function q2(){
setP(58,'驗證 2 / 3｜有 ValueError');
mount(
'<div class="step">驗證 2｜有符合的例外</div>'+
'<div class="code">try:\n    int("abc")\nexcept ValueError:\n    print("E")\nelse:\n    print("OK")\nfinally:\n    print("END")</div>'+
'<div class="prompt">這次 try 會發生 ValueError。哪一條路徑正確？</div>'+
opt('A. except → finally','A')+
opt('B. else → finally','B')+
opt('C. except → else → finally','C')+
unk(),
function(v){
 if(v==='__U__')return stop('Q2');
 log('Q2',v);
 if(v==='A')q3();
 else q2hint();
});
}
function q2hint(){
mount('<div class="fb bad">這次 try 發生的是 <b>ValueError</b>，而且剛好有 matching except ValueError。<br><br>所以會進 except；有例外時不進 else；最後仍到 finally。</div>'+flow()+
'<button id="r" class="primary">再答一次</button>'+unk(),
function(v){if(v==='__U__')stop('Q2_hint');});
document.getElementById('r').onclick=q2;
}

function q3(){
setP(78,'驗證 3 / 3｜辨識 finally');
mount(
'<div class="step">驗證 3｜finally</div>'+
'<div class="prompt">下列哪一句最接近 finally 的作用？</div>'+
opt('A. 只有發生例外才執行','A')+
opt('B. 只有沒有例外才執行','B')+
opt('C. 通常不論前面有沒有例外，最後都會執行','C')+
unk(),
function(v){
 if(v==='__U__')return stop('Q3');
 log('Q3',v);
 if(v==='C')returnBack();
 else q3hint();
});
}
function q3hint(){
mount('<div class="fb bad">finally 常用來做「不論前面成功或失敗，都要做的收尾工作」。</div>'+
'<div class="prompt">所以 finally 最接近：</div>'+opt('A. 通常都會執行','Y')+opt('B. 只有有錯才執行','N')+unk(),
function(v){
 if(v==='__U__')return stop('Q3_hint');
 log('Q3_hint',v);
 if(v==='Y')returnBack(); else q3hint();
});
}

function returnBack(){
setP(92,'完成微教學｜準備回 Q44');
mount(
'<div class="fb good"><b>3 個核心節點已通過。</b></div>'+
flow()+
'<div class="prompt">現在不要再看這三題。下一步應該回到原 Q44，再看能不能自己整合出輸出順序。</div>'+
'<button id="done" class="primary">完成微教學</button>',
function(){});
document.getElementById('done').onclick=function(){showResult(true);};
}

function textResult(ok){
var lines=[];
lines.push('En-Xiang Python try/except Micro Lesson - Result');
lines.push('Version: TRY_EXCEPT_RETEACH_20260928_V1');
lines.push('Status: '+(ok?'MICRO LESSON COMPLETED':'NOT UNDERSTOOD / STOPPED'));
lines.push('');
lines.push('ANSWER PATH');
for(var i=0;i<state.route.length;i++)lines.push((i+1)+'. '+state.route[i]);
lines.push('');
lines.push(ok?'Next step: Retry Q44 Guided Correction.':'Next step: Needs direct reteaching before retrying Q44.');
return lines.join('\r\n');
}
function copyR(ok){var t=textResult(ok);if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){alert('已複製');});}}
function downR(ok){var t=textResult(ok),b=new Blob([t],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='EnXiang_try_except_micro_lesson_result.txt';document.body.appendChild(a);a.click();setTimeout(function(){a.remove();URL.revokeObjectURL(u);},500);}
function shareR(ok){var t=textResult(ok);if(navigator.share){navigator.share({title:'恩翔 try/except 微教學結果',text:t});}else copyR(ok);}
function showResult(ok){
setP(100,'完成');stage.classList.add('hidden');result.classList.remove('hidden');
result.innerHTML='<h2>'+(ok?'微教學完成':'本題停止')+'</h2>'+
(ok?'<div class="fb good">下一步：回到 Q44 Guided Correction，再測一次原題。</div>':'<div class="fb">已選「不懂」，先不要回 Q44。</div>')+
'<pre class="log">'+textResult(ok)+'</pre>'+
'<button class="primary" id="share">傳送到 LINE</button>'+
'<button class="secondary" id="copy">複製結果</button>'+
'<button class="secondary" id="down">下載 TXT</button>';
document.getElementById('share').onclick=function(){shareR(ok)};
document.getElementById('copy').onclick=function(){copyR(ok)};
document.getElementById('down').onclick=function(){downR(ok)};
}
intro();
})();
</script>
</body>
</html>
