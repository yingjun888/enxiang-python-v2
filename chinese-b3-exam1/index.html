function statusLabel(p,unknown){ if(unknown>=0.4||p<0.4)return ['完全不會/需重教','tag-bad']; if(p<0.7)return ['弱','tag-bad']; if(p<0.85)return ['不穩','tag-warn']; return ['穩定','tag-good']; }
function intro(){document.getElementById('app').innerHTML=`<div class="card intro"><h2>國二國文｜第一次段考 100題全範圍診斷 V1</h2><p><span class="pill">康軒八上</span><span class="pill">L1～L3＋詞類</span><span class="pill">恩翔難度 9.0+</span></p><ul><li>目的不是刷分數，而是找出：<b>弱、完全不會、只是粗心、已穩定</b>。</li><li>100題分成 <b>4 回 × 25 題</b>，不建議一次做完。手機會自動保存進度。</li><li>遇到真的不懂，請按「<b>不懂／不確定觀念</b>」，不要亂猜。這是正式診斷資料。</li><li>閱讀題只占少量；主力放在課內文意、注釋／字義、古詩、詞類與近似選項。</li><li>完成後會顯示各範圍正確率與「完全不會／弱／不穩／穩定」。</li></ul><button class="start" onclick="go()">${Object.keys(st.ans).length?'繼續作答':'開始第1回'}</button>${Object.keys(st.ans).length?'<p class="small" style="text-align:center"><a href="#" onclick="resetAll();return false">清除紀錄重新開始</a></p>':''}</div>`}

 const q=Q[st.idx], a=st.ans[q.id]; const done=Object.keys(st.ans).length;
 document.getElementById('app').innerHTML=`<div class="top"><div class="title">第 ${q.id} / 100 題</div><div class="sub">第 ${Math.floor((q.id-1)/25)+1} 回｜${q.cat} · ${q.sub}｜難度 ${q.difficulty.toFixed(1)}</div><div class="bar"><div class="fill" style="width:${done}%"></div></div></div><div class="card"><div class="meta"><span>${q.cat}</span><span>已作答 ${done} / 100</span></div><div class="stem">${q.stem}</div>${q.options.map((o,i)=>`<button class="opt ${a===i?'sel':''}" onclick="pick(${i})"><b>${'ABCD'[i]}.</b> ${o}</button>`).join('')}<button class="opt dont ${a==='U'?'sel':''}" onclick="pick('U')">不懂／不確定觀念</button><div class="nav"><button class="secondary" onclick="prev()" ${st.idx===0?'disabled':''}>上一題</button><button onclick="next()">${q.id%25===0 && q.id<100?'完成本回':'下一題'}</button></div></div>`;

function calc(){let cats={},subs={},correct=0,unknown=0; for(const q of Q){let a=st.ans[q.id], ok=a===q.answer; if(ok)correct++;if(a==='U')unknown++; for(const [obj,k] of [[cats,q.cat],[subs,q.cat+'｜'+q.sub]]){obj[k]??={n:0,c:0,u:0};obj[k].n++; if(ok)obj[k].c++; if(a==='U')obj[k].u++;}} return {cats,subs,correct,unknown};}
function result(){const x=calc(), mins=Math.max(1,Math.round((Date.now()-st.start)/60000)); let rows=Object.entries(x.cats).map(([k,v])=>{let p=v.c/v.n;let [lab,cl]=statusLabel(p,v.u/v.n);return `<tr><td>${k}</td><td>${v.c}/${v.n} (${Math.round(p*100)}%)</td><td>${v.u}</td><td class="${cl}">${lab}</td></tr>`}).join(''); let weak=Object.entries(x.subs).map(([k,v])=>[k,v,v.c/v.n]).filter(z=>z[2]<.85||z[1].u>0).sort((a,b)=>a[2]-b[2]).slice(0,12).map(z=>`<li><b>${z[0]}</b>：${z[1].c}/${z[1].n}，不懂 ${z[1].u}</li>`).join('');
 document.getElementById('app').innerHTML=`<div class="card result"><h2>診斷完成</h2><div class="grid"><div class="stat">總正確<br><b>${x.correct} / 100</b></div><div class="stat">按「不懂」<br><b>${x.unknown} 題</b></div><div class="stat">作答時間<br><b>${mins} 分</b></div><div class="stat">定位<br><b>全範圍診斷</b></div></div><h3>各範圍</h3><table class="table"><tr><th>範圍</th><th>正確</th><th>不懂</th><th>狀態</th></tr>${rows}</table><h3>優先補洞清單</h3><ol>${weak||'<li>目前沒有低於85%的子項目。</li>'}</ol><p class="small">判定只作為第一輪診斷：不懂率≥40%或正確率&lt;40%＝完全不會/需重教；40–69%＝弱；70–84%＝不穩；≥85%＝穩定。真正的長期弱點仍需後續 Transfer / delayed retest 驗證。</p><div class="nav"><button class="secondary" onclick="copyResult()">複製結果</button><button onclick="downloadResult()">下載 JSON</button></div><p class="small" style="text-align:center"><a href="#" onclick="resetAll();return false">清除紀錄重新測</a></p></div>`;}
function summaryObj(){const x=calc();return {test:'國二國文第一次段考100題全範圍診斷V1_9.0plus',finished_at:new Date().toISOString(),minutes:Math.max(1,Math.round((Date.now()-st.start)/60000)),correct:x.correct,unknown:x.unknown,categories:x.cats,subskills:x.subs,answers:st.ans}}
function copyResult(){navigator.clipboard.writeText(JSON.stringify(summaryObj(),null,2)).then(()=>alert('結果已複製，可直接貼回 ChatGPT。'));}
function downloadResult(){const b=new Blob([JSON.stringify(summaryObj(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='恩翔_國文100題診斷結果.json';a.click();URL.revokeObjectURL(a.href);}
function resetAll(){if(confirm('確定清除全部作答紀錄？')){localStorage.removeItem(KEY);st={idx:0,ans:{},start:Date.now(),done:false};intro();}}
if(st.done && Object.keys(st.ans).length===100) result(); else intro();
</script></div></body></html>
